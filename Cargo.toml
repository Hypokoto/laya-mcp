[workspace]
resolver = "2"
members = [
    "crates/laya-core",
    "crates/laya-preprocess",
    "crates/laya-onnx",
    "crates/laya-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Hypokoto"]

[workspace.dependencies]
laya-core = { path = "crates/laya-core" }
laya-preprocess = { path = "crates/laya-preprocess" }
laya-onnx = { path = "crates/laya-onnx" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
ort = "2.0.0-rc.14"
ndarray = "0.16"
tokenizers = { version = "0.21.0", default-features = false, features = ["onig", "esaxx_fast"] }
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
regex = "1.10"
toml = "0.8"
